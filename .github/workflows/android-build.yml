# Android build for the mobile client.
#
# Separate from ci.yml because this needs a JDK, the Android SDK, and the NDK, and
# takes far longer than the JavaScript checks. It is the check that catches a native
# dependency or Gradle break, which no JavaScript test can see.
#
# Runs on pushes to main and on manual dispatch. Branch PRs get ci.yml only.

name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    # The React Native app lives at the repository ROOT; only Gradle runs inside
    # android/. Previously this job set working-directory to a `FinanceAI/`
    # subdirectory that only ever existed as a stray gitlink, so setup-node
    # failed on a missing package-lock.json before Gradle was ever reached.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json declares "node": ">= 22.11.0".
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # Metro must be reachable for the debug bundle's dev-server settings, but
      # assembleDebug does not need it: it packages the app and loads JS from
      # Metro at runtime. The JS itself is proven by ci.yml's bundle check.
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # A successful build that packaged an empty entry module once shipped a
      # broken app, so the artifact is inspected rather than trusted.
      - name: Confirm the APK is not empty
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
